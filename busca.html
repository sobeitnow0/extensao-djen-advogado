<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca e Radar | Buscador DJEN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Estilos baseados no seu index.html (Minimalismo/Legal Design) */
        :root {
            --primary: #0075de;
            --zen-orange: #dd5b00;
            --bg-section: #f6f5f4;
            --text-main: rgba(0, 0, 0, 0.95);
            --text-muted: #615d59;
            --border-light: rgba(0, 0, 0, 0.08);
            --radius-card: 12px;
            --highlight-bg: #fff9c4; /* Cor do Radar */
        }

        body { font-family: 'Inter', sans-serif; background: #fff; color: var(--text-main); line-height: 1.6; }
        .container { max-width: 850px; margin: 40px auto; padding: 0 20px; }
        
        .search-box { background: #fff; border: 1px solid var(--border-light); border-radius: var(--radius-card); padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
        
        /* Estilo do Campo Radar */
        .radar-config { margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--border-light); }
        .radar-input { width: 100%; padding: 10px; border: 1px solid var(--border-light); border-radius: 6px; font-size: 13px; margin-top: 8px; box-sizing: border-box; }

        .btn-busca { width: 100%; background: var(--primary); color: #fff; border: none; padding: 15px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 20px; transition: 0.2s; }
        .btn-busca:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Estilo dos Resultados com Realce */
        .result-item { margin-top: 20px; padding: 20px; border: 1px solid var(--border-light); border-radius: 12px; transition: 0.3s; }
        .result-item:hover { border-color: var(--primary); }
        
        .mark-radar { background-color: var(--highlight-bg); font-weight: 600; padding: 0 2px; border-bottom: 2px solid var(--zen-orange); color: #000; }
        
        .badge { font-size: 10px; text-transform: uppercase; font-weight: 800; background: var(--bg-section); padding: 4px 8px; border-radius: 4px; color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <div class="search-box">
        <h2 style="margin-top:0">🔍 Busca Processual</h2>
        
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 15px;">
            <div>
                <label style="font-size:12px; font-weight:700">OAB ou Processo</label>
                <input type="text" id="inputBusca" class="radar-input" style="font-size:16px" placeholder="Ex: 349757SP ou NPU">
            </div>
            <div>
                <label style="font-size:12px; font-weight:700">UF (OAB)</label>
                <input type="text" id="inputUF" class="radar-input" style="font-size:16px" placeholder="SP">
            </div>
        </div>

        <div class="radar-config">
            <label style="font-size:12px; font-weight:700; color: var(--zen-orange)">🛰️ RADAR DE TERMOS</label>
            <p style="font-size:11px; color: var(--text-muted); margin: 4px 0;">Palavras separadas por vírgula que o sistema irá destacar nas publicações.</p>
            <input type="text" id="termosRadar" class="radar-input" placeholder="Ex: Prazo, Sentença, Urgente, Seu Nome...">
        </div>

        <button class="btn-busca" id="executar">Pesquisar e Aplicar Radar</button>
    </div>

    <div id="resultados"></div>
</div>

<script>
    // Recupera termos salvos para manter a experiência do usuário (UX)
    document.getElementById('termosRadar').value = localStorage.getItem('site_radar_termos') || 'prazo, sentença, acórdão';

    async function realizarBusca() {
        const query = document.getElementById('inputBusca').value;
        const uf = document.getElementById('inputUF').value;
        const radarTermos = document.getElementById('termosRadar').value.split(',').map(t => t.trim()).filter(t => t !== "");
        
        // Salva termos no navegador
        localStorage.setItem('site_radar_termos', document.getElementById('termosRadar').value);

        const resDiv = document.getElementById('resultados');
        resDiv.innerHTML = "<p>Consultando base do CNJ...</p>";

        try {
            // Lógica de fetch simplificada para o exemplo
            const url = `https://comunicaapi.pje.jus.br/api/v1/comunicacao?numeroOab=${query}&ufOab=${uf}`;
            const response = await fetch(url);
            const data = await response.json();

            resDiv.innerHTML = "";

            if(data.items.length === 0) {
                resDiv.innerHTML = "<p>Nenhuma publicação encontrada.</p>";
                return;
            }

            data.items.forEach(item => {
                let textoFormatado = item.texto;

                // APLICAÇÃO DO RADAR (Highlight dinâmico)
                radarTermos.forEach(termo => {
                    const regex = new RegExp(`(${termo})`, 'gi');
                    textoFormatado = textoFormatado.replace(regex, '<span class="mark-radar">$1</span>');
                });

                const card = document.createElement('div');
                card.className = 'result-item';
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px">
                        <span class="badge">${item.siglaTribunal}</span>
                        <small>${item.data_disponibilizacao}</small>
                    </div>
                    <strong style="color:var(--primary)">${item.numeroProcesso}</strong>
                    <div style="margin-top:10px; font-size:14px; color:var(--text-muted)">${textoFormatado}</div>
                `;
                resDiv.appendChild(card);
            });

        } catch (e) {
            resDiv.innerHTML = "<p>Erro na conexão. Verifique os dados ou tente novamente.</p>";
        }
    }

    document.getElementById('executar').onclick = realizarBusca;
</script>

</body>
</html>
