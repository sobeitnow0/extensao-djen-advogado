<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Buscador DJEN</title>
    <style>
        :root {
            --bg-body: #f6f5f4;
            --bg-panel: #ffffff;
            --text-main: #241f31;
            --text-muted: #5e5c64;
            --border-light: rgba(0, 0, 0, 0.08);
            --primary: #3584e4;
            --btn-bg: #eeeeec;
            --btn-hover: #d6d6d1;
            --badge-bg: #ebebeb;
            --highlight-bg: #f9f06b;
            --radius: 12px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #242424;
                --bg-panel: #303030;
                --text-main: #ffffff;
                --text-muted: #9a9996;
                --border-light: rgba(255, 255, 255, 0.08);
                --primary: #62a0ea;
                --btn-bg: #3d3d3d;
                --btn-hover: #4d4d4d;
                --badge-bg: #474747;
                --highlight-bg: #d4a017;
            }
        }

        body { font: message-box; font-family: -apple-system, sans-serif; width: 440px; margin: 0; padding: 20px; background-color: var(--bg-body); color: var(--text-main); -webkit-font-smoothing: antialiased; }
        h2 { margin: 0 0 20px 0; font-size: 14px; font-weight: 800; text-align: center; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; }

        .form-row { display: flex; gap: 10px; margin-bottom: 12px; }
        input, select { font: inherit; width: 100%; padding: 10px 14px; background-color: var(--bg-panel); color: var(--text-main); border: 1px solid var(--border-light); border-radius: var(--radius); font-size: 13px; outline: none; transition: all 0.2s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(53, 132, 228, 0.15); }

        .btn-group { display: flex; gap: 8px; margin-bottom: 20px; }
        .btn-group button { font: inherit; flex: 1; padding: 8px; font-size: 11px; font-weight: 700; background-color: var(--btn-bg); color: var(--text-main); border: none; border-radius: var(--radius); cursor: pointer; transition: 0.2s; }
        .btn-group button:hover { background-color: var(--btn-hover); }

        .btn-main { font: inherit; width: 100%; padding: 12px; background-color: var(--btn-bg); color: var(--text-main); border: 1px solid var(--border-light); border-radius: var(--radius); font-size: 13px; font-weight: 800; cursor: pointer; margin-bottom: 20px; transition: all 0.2s; }
        .btn-main:hover { background-color: var(--primary); color: white; border-color: var(--primary); }

        #containerFiltro { display: none; flex-direction: column; gap: 12px; margin-bottom: 15px; }
        .filtros-linha { display: flex; gap: 8px; }

        .controles-lista { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .btn-acao-lista { font: inherit; background: var(--btn-bg); border: none; color: var(--text-main); font-size: 11px; font-weight: 700; cursor: pointer; padding: 6px 14px; border-radius: 20px; transition: 0.2s; }
        .btn-acao-lista:hover { background-color: var(--btn-hover); }

        .contador-text { font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.2px; }

        .dropdown { position: relative; }
        .dropdown-content { display: none; position: absolute; left: 0; top: 110%; background-color: var(--bg-panel); min-width: 160px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border: 1px solid var(--border-light); border-radius: var(--radius); z-index: 10; overflow: hidden; }
        .dropdown-content.show { display: flex; flex-direction: column; }
        .dropdown-content button { font: inherit; background: none; border: none; padding: 12px; text-align: left; cursor: pointer; font-size: 12px; color: var(--text-main); border-bottom: 1px solid var(--border-light); }
        .dropdown-content button:hover { background-color: var(--btn-bg); }

        #resultados { display: flex; flex-direction: column; gap: 10px; max-height: 380px; overflow-y: auto; padding-right: 4px; }
        .intimacao-card { background-color: var(--bg-panel); border: 1px solid var(--border-light); border-radius: var(--radius); overflow: hidden; flex-shrink: 0; transition: all 0.2s ease; }
        .intimacao-card:hover { border-color: rgba(53, 132, 228, 0.4); background-color: rgba(255, 255, 255, 0.02); transform: translateY(-1px); }
        .intimacao-card.hoje { border-left: 4px solid var(--primary); }
        
        .intimacao-card.lido:not(.aberto) { opacity: 0.55; filter: grayscale(0.3); }
        
        .card-header { display: grid; grid-template-columns: 50px 1fr auto 40px; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; min-height: 44px; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; }
        .badge-tribunal { background-color: var(--badge-bg); color: var(--text-main); opacity: 0.8; }
        .proc-numero { font-size: 12px; font-weight: 700; color: var(--text-main); font-family: monospace; letter-spacing: -0.4px; }
        .data-disp { font-size: 11px; color: var(--text-muted); font-weight: 600; text-align: right; }

        .teor-container { display: none; border-top: 1px solid var(--border-light); background-color: rgba(0,0,0,0.01); }
        .teor-texto { font-size: 13px; line-height: 1.6; color: var(--text-main); padding: 15px; }
        .intimacao-card.aberto .teor-container { display: block; }
        .highlight-term { background-color: var(--highlight-bg); color: black; padding: 0 2px; border-radius: 3px; font-weight: 700; }

        .card-acoes { padding: 0 15px 15px 15px; display: flex; flex-direction: column; gap: 10px; }
        .botoes-acao { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .btn-abrir-calc { padding: 8px 14px; }
        
        .calculadora-prazo { padding: 12px; background-color: var(--bg-body); border-radius: var(--radius); border: 1px solid var(--border-light); display: none; }
        .calculadora-prazo.ativa { display: block; animation: fadeIn 0.2s ease-in-out; }
        .calc-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        .resultado-prazo { font-weight: 800; color: var(--primary); font-size: 13px; text-align: right; letter-spacing: -0.3px; min-height: 18px; line-height: 1.3; }
        .resultado-aux { font-size: 10px; color: var(--text-muted); font-weight: 600; }
        
        .skeleton-card { height: 48px; background-color: var(--bg-panel); border-radius: var(--radius); margin-bottom: 8px; animation: pulse 1.5s infinite; flex-shrink: 0; }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 0.3; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .disclaimer { text-align: center; font-size: 10px; color: var(--text-muted); margin-top: 20px; font-weight: 600; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 10px; }
    </style>
</head>
<body>
    <h2>Buscador DJEN</h2>
    <div id="areaBusca">
        <div class="form-row">
            <input type="text" id="oabNum" placeholder="Nº OAB" autocomplete="off">
            <input type="text" id="oabUf" placeholder="UF" maxlength="2" style="width: 80px;">
        </div>
        <div class="form-row">
            <input type="date" id="dataInicio">
            <input type="date" id="dataFim">
        </div>
        <div class="btn-group">
            <button id="btnHoje">Hoje</button>
            <button id="btn5Dias">5 Dias</button>
            <button id="btnMes">Mês</button>
        </div>
        <button id="btnBuscar" class="btn-main">CONSULTAR INTIMAÇÕES</button>
    </div>

    <div id="containerFiltro">
        <div class="filtros-linha">
            <select id="filtroTribunal" style="width: 35%;"><option value="">Tribunal</option></select>
            <input type="text" id="filtroRapido" placeholder="Filtrar por texto ou processo..." style="width: 65%;">
        </div>
        <div class="controles-lista">
            <div class="dropdown">
                <button id="btnExportarMenu" class="btn-acao-lista">Exportar ▾</button>
                <div id="dropdownExportar" class="dropdown-content">
                    <button id="btnCopiarTodos">📋 Copiar Resultados</button>
                    <button id="btnDownloadTxt">💾 Baixar .txt</button>
                </div>
            </div>
            
            <span id="contadorResultados" class="contador-text"></span>

            <button id="btnExpandirTodos" class="btn-acao-lista">Expandir Tudo</button>
        </div>
    </div>

    <div id="skeletonLoader" style="display:none">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
    </div>

    <div id="resultados"></div>
    <div class="disclaimer">Amilcar Moreira • Santos, SP</div>
    <script src="popup.js"></script>
</body>
</html>
